name: VLM relay (temporary)

# One-shot machine-vision verification relay. Runs the candidate bundle through
# Google Gemini from a US Actions runner (the sandbox egress is geo-blocked by
# both Google and Groq). Uses the repo's existing GEMINI_API_KEY secret — the
# same key the daily agent uses for Swahili caption rewrites.
# Safe to delete from main after the relay artifact has been collected.

on:
  workflow_dispatch:
    inputs:
      bundle_ref:
        description: 'Branch holding the relay bundle'
        required: false
        default: 'vlm-relay-tmp'
      api_key:
        description: 'Optional API key override (fresh-quota key); masked in logs'
        required: false
        default: ''
      model:
        description: 'Optional model override (e.g. gemini-3.8-flash)'
        required: false
        default: ''
      lang_order:
        description: 'Verification priority order (en,sw or sw,en)'
        required: false
        default: 'en,sw'

concurrency:
  group: vlm-relay
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repo (main)
        uses: actions/checkout@v4

      - name: Checkout bundle branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.bundle_ref || 'vlm-relay-tmp' }}
          path: bundle

      - name: Extract bundle
        run: |
          mkdir -p work
          tar xzf bundle/relay/relay-bundle.tgz -C work
          echo "bundle files: $(find work/candidates -type f | grep -vc meta || true)"
          echo "images: $(find work/candidates -type f -regex '.*\.\(jpe\?g\|png\|webp\)' | wc -l)"

      - name: Mask key override
        if: ${{ inputs.api_key != '' }}
        run: echo "::add-mask::${{ inputs.api_key }}"

      - name: Run VLM relay
        working-directory: work
        env:
          GEMINI_API_KEY: ${{ inputs.api_key || secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model || vars.GEMINI_MODEL }}
          RELAY_LANG_ORDER: ${{ inputs.lang_order || 'en,sw' }}
        run: node relay_verify.mjs 2>&1 | tee relay-log.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-results
          path: |
            work/relay-out/
            work/relay-log.txt
          retention-days: 3
          if-no-files-found: warn
