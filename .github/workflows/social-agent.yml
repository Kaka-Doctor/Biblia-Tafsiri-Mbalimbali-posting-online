name: Bible Verse Agent

# ─────────────────────────────────────────────────────────────────────────────
#  Biblia Tafsiri Mbalimbali — posts one verse-of-the-day image + a caption
#  in the SAME language as the scripture on that image to the Facebook page
#  AND the connected Instagram account (@biblia_tafsiri_mbalimbali) every day
#  at 09:00 EAT — alternating daily: English one day, Kiswahili the next
#  (owner rule 2026-09-22).
#
#  GitHub's cron fires this workflow every 30 minutes around the clock at
#  :13/:43 — but the timing barely matters. Every run that lands PRE-SCHEDULES
#  the next "scheduleDays" days (default 3) with META'S OWN scheduled
#  publishing — Meta's servers then publish each post exactly at 09:00 EAT,
#  no matter when or whether GitHub fires again.
#
#  WHY THIS DESIGN? GitHub silently DROPS most scheduled runs on young
#  accounts (observed live on the sister repo: 1 of ~70 fires landed on
#  2026-09-21, regardless of cron density). Relying on GitHub firing at slot
#  time does not work. With Meta-side pre-scheduling, ONE landed run every
#  2 days keeps the horizon booked. Landed runs also record permalinks after
#  posts go live, and late direct posting (4-hour catch-up, "graceMinutes")
#  remains the fallback for unscheduled slots.
#
#  The minutes are deliberately OFF-PEAK (:13/:43, never :00/:30): GitHub
#  drops scheduled runs at peak minutes when Actions load is high.
#
#  TOKENS: the permanent page token (data/config.json → pageAccessToken,
#  minted 2026-09-22, covers pages_manage_posts + instagram_content_publish)
#  never expires. If it is ever revoked, paste a fresh Graph API Explorer
#  token into data/meta-token.txt and push — the next landed run re-mints it
#  and clears the file.
#
#  MUTUAL RESCUE (owner rule 2026-09-24): every landed run also checks the
#  sibling pages (data/config.json "siblings" — Ladies of Destiny +
#  Teacher's Lesson Plan) via the GitHub API and dispatches a sibling whose
#  IG half is due but has no landed run of its own — API dispatches are 100%
#  reliable, unlike cron schedules. Needs the dispatch token (data/config.json
#  "dispatchToken" — fine-grained PAT: contents:read + actions:write on the
#  sibling repos; a DISPATCH_TOKEN repo secret would override it).
#  Dispatched runs carry input rescuedBy and skip their own sibling check
#  (one hop, no ping-pong).
#
#  ⟶ To CHANGE posting time: edit "slots" (and "timezone") in data/config.json
#    only — this file never needs to change.
# ⟶ To POST RIGHT NOW (or rescue a MISSED slot the same day): Actions tab →
#    "Bible Verse Agent" → "Run workflow" → tick "force".
# ⟶ To TEST without publishing: same, but tick "dryRun".
# ⟶ To TEST THE GEMINI KEY without publishing: tick "gemini-test" — runs
#    scripts/gemini-selftest.mjs with the GEMINI_API_KEY secret and skips the
#    agent entirely (no posts, no state changes).
# ⟶ To PAUSE: set "autoPost": false in data/config.json — the next landed
#    run also deletes any pending Meta-scheduled posts.
#
#  Free-tier notes (private repo): only runs that START bill minutes (~2-5
#  landed runs/day ≈ 100-300 of the 2000 monthly included minutes). State
#  commits after every posting keep the repo active, so scheduled workflows
#  never get auto-disabled.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run — pick content and log the plan, publish nothing"
        type: boolean
        default: false
      force:
        description: "Force — post the most recent unposted slot right now (rescues a missed slot the same day)"
        type: boolean
        default: false
      gemini-test:
        description: "Gemini self-test — verify the GEMINI_API_KEY secret works for Swahili captions (posts nothing)"
        type: boolean
        default: false
      rescuedBy:
        description: "Internal — set automatically when a sibling page's agent dispatched this run (mutual rescue); skips this run's own sibling check"
        type: string
        default: ""

# Never let two runs race on data/state.json
concurrency:
  group: bible-verse-agent
  cancel-in-progress: false

permissions:
  contents: write # to commit data/state.json back

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Any file dropped into data/photos/ (phone PNG, huge export, too-small
      # image) is auto-converted/cropped/scaled to platform-safe JPEG and the
      # fix is committed back to the repo.
      - name: Gemini self-test (optional)
        if: inputs.gemini-test == true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/gemini-selftest.mjs

      - name: Normalize photos
        if: inputs.gemini-test != true
        run: |
          mkdir -p /tmp/norm && cd /tmp/norm
          npm init -y >/dev/null 2>&1
          npm install sharp --silent --no-audit --no-fund >/dev/null 2>&1 || true
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/norm/node_modules node scripts/normalize-photos.js \
            || echo "normalize skipped (non-fatal — the agent posts files as-is)"

      - name: Run the agent
        if: inputs.gemini-test != true
        env:
          INPUT_DRY_RUN: ${{ inputs.dryRun }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_RESCUED_BY: ${{ inputs.rescuedBy }}
          # Mutual rescue (owner rule 2026-09-24): lets this agent check the
          # sibling pages' repos and dispatch their workflows when a sibling
          # has an IG half due but no landed run of its own. Token: data/config
          # "dispatchToken" (fine-grained PAT, contents:read + actions:write
          # on the sibling repos); this secret, if set, overrides it.
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          # Optional Google Gemini (owner request 2026-09-22): with this secret
          # set, Swahili captions are rewritten by Gemini at posting time;
          # without it the stored captions in data/posts.json are used.
          # Create a free key at aistudio.google.com/apikey → repo Settings →
          # Secrets and variables → Actions → New repository secret →
          # name: GEMINI_API_KEY
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          FLAGS=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "$INPUT_FORCE" = "true" ]; then FLAGS="$FLAGS --force"; fi
          node scripts/gh-agent.mjs $FLAGS

      - name: Persist state + normalized photos
        if: inputs.gemini-test != true
        run: |
          git config user.name "verse-agent-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "nothing changed — no commit"
          else
            git commit -m "agent: state update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push || (git pull --rebase origin main && git push)
          fi
